name: Publish FreakSwap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare audited static site
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil
          from pathlib import Path
          files = json.loads(Path('.github/pages-files.json').read_text())['files']
          for item in files:
              source = Path(item['path'])
              if source.is_absolute() or '..' in source.parts or source.is_symlink():
                  raise SystemExit('Invalid release path')
              data = source.read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Release integrity check failed: ' + str(source))
              target = Path('_site') / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PYTHON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
